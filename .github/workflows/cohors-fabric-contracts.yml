name: Cohors Fabric contracts

'on':
  push:
    branches: [micnhs-cohors-fabric-umsetzung]

permissions:
  contents: read

concurrency:
  group: cohors-fabric-contracts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Isolated Fabric build and local contracts only
    if: ${{ github.ref == 'refs/heads/micnhs-cohors-fabric-umsetzung' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Allocate per-run tool and package directories
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "cohors-fabric-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $paths = @{
            DOTNET_CLI_HOME = 'dotnet-home'
            DOTNET_INSTALL_DIR = 'dotnet'
            NUGET_PACKAGES = 'nuget'
            npm_config_cache = 'npm'
          }
          foreach ($name in $paths.Keys) {
            $path = Join-Path $root $paths[$name]
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            "$name=$path" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.10.0'
          package-manager-cache: false
      - name: Validate exact source without SQL, Docker, browser or cloud
        shell: pwsh
        run: ./scripts/fabric/Test-HostedContracts.ps1
      - name: Prepare explicitly requested RID lock source without uploading
        id: c1-locks
        if: >-
          ${{ success() && github.repository == 'micnhs/AMA-05-agentic-PMS-02' && github.event_name == 'push' && contains(github.event.head_commit.message, 'Cohors-C1-Locks: requested') }}
        shell: pwsh
        run: ./scripts/fabric/Build-C1Package.ps1 -PrepareRuntimeLocks
      - name: Package explicitly requested C1 release after validation
        id: c1-package
        if: >-
          ${{ success() && github.repository == 'micnhs/AMA-05-agentic-PMS-02' && github.event_name == 'push' && contains(github.event.head_commit.message, 'Cohors-C1-Package: requested') }}
        shell: pwsh
        run: ./scripts/fabric/Build-C1Package.ps1
      - name: Upload the single bounded C1 deployment package
        id: c1-upload
        if: ${{ success() && steps.c1-package.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cohors-fabric-c1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.c1-package.outputs.package-directory }}/package.zip
            ${{ steps.c1-package.outputs.package-directory }}/archive.json
          retention-days: 1
          compression-level: 0
          archive: true
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
      - name: Bind the actual GitHub archive digest
        if: ${{ success() && steps.c1-upload.outcome == 'success' }}
        shell: pwsh
        env:
          C1_ARTIFACT_ID: ${{ steps.c1-upload.outputs.artifact-id }}
          C1_ARTIFACT_DIGEST: ${{ steps.c1-upload.outputs.artifact-digest }}
        run: |
          if ($env:C1_ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or $env:C1_ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') {
            throw 'Artifact service did not return the exact archive identity/digest.'
          }
          "- GitHub artifact ID: $env:C1_ARTIFACT_ID; actual outer ZIP SHA256: $env:C1_ARTIFACT_DIGEST" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
