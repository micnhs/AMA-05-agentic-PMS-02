<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1230" viewBox="0 0 1660 1230" role="img" aria-labelledby="title desc">
  <title id="title">Cohors: PMS-Prozess, Akteure und Freigaben</title>
  <desc id="desc">Vom Quelleingang über Fall und Frist zu Evidenz, KI-Analyse und Assurance. Menschen genehmigen Informationsanfragen und treffen medizinische sowie regulatorische Entscheidungen. Die Software friert ein Paket ein und übermittelt ausschließlich simuliert. Quittungen, Untersuchung, CAPA, Trends und PSUR schließen den Regelkreis. Ein dringlicher Parallelweg führt direkt zur menschlichen Prüfung einer vorläufigen Meldung; Nachforderungen pausieren keine Frist.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#326780" />
    </marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b95012" />
    </marker>
  </defs>
  <rect width="1660" height="1230" fill="#ffffff" />
  <rect x="40" y="34" width="9" height="44" rx="3" fill="#d56a24" />
  <text x="68" y="67" class="title" font-family="Arial" fill="#14364e" font-size="34px" font-weight="700">Cohors | Vom Eingang zur verantworteten Entscheidung</text>
  <text x="68" y="103" class="body" font-family="Arial" fill="#14364e" font-size="18px">Akteure stehen in jeder Aktivität. Orange markiert menschliche Verantwortung, nicht KI-Autonomie.</text>
  <rect x="40" y="123" width="1580" height="50" rx="10" fill="#133a56" />
  <text x="62" y="155" class="body" fill="#ffffff" style="fill:#ffffff" font-family="Arial" font-size="18px">Durchgehend: Fristen-Watchdog + Audit · Nachfragen, KI-Ausfall und Review pausieren keine gesetzliche Frist.</text>
