  <rect x="60" y="228" width="240" height="103" rx="12" class="system" fill="#edf3f7" stroke="#315f7b" stroke-width="2" />
  <text x="78" y="260" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">01 Quellen aufnehmen</text>
  <text x="78" y="291" class="body" font-family="Arial" fill="#14364e" font-size="18px">Connector / PMS</text>
  <text x="78" y="316" class="small" font-family="Arial" fill="#486475" font-size="17px">Original + Eingangszeit</text>
  <rect x="380" y="228" width="240" height="103" rx="12" class="system" fill="#edf3f7" stroke="#315f7b" stroke-width="2" />
  <text x="398" y="260" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">02 Fall und Frist</text>
  <text x="398" y="291" class="body" font-family="Arial" fill="#14364e" font-size="18px">System + PMS-Triage</text>
  <text x="398" y="316" class="small" font-family="Arial" fill="#486475" font-size="17px">Awareness · Owner</text>
  <rect x="690" y="228" width="240" height="103" rx="12" class="system" fill="#edf3f7" stroke="#315f7b" stroke-width="2" />
  <text x="708" y="260" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">03 Evidenz bündeln</text>
  <text x="708" y="291" class="body" font-family="Arial" fill="#14364e" font-size="18px">Knowledge-Service</text>
  <text x="708" y="316" class="small" font-family="Arial" fill="#486475" font-size="17px">Spezifikation · Test · Fälle</text>
  <rect x="690" y="398" width="240" height="117" rx="12" class="agent" fill="#e5f2f8" stroke="#2a7fa5" stroke-width="2" />
  <text x="708" y="431" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">04 Analyse entwerfen</text>
  <text x="708" y="462" class="body" font-family="Arial" fill="#14364e" font-size="18px">Assessment Agent</text>
  <text x="708" y="488" class="small" font-family="Arial" fill="#486475" font-size="17px">Kausalität · Risiko</text>
  <text x="708" y="509" class="small" font-family="Arial" fill="#486475" font-size="17px">Belege + Gegenhypothesen</text>
  <rect x="1000" y="398" width="240" height="117" rx="12" class="agent" fill="#e5f2f8" stroke="#2a7fa5" stroke-width="2" />
  <text x="1018" y="431" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">05 Qualität prüfen</text>
  <text x="1018" y="462" class="body" font-family="Arial" fill="#14364e" font-size="18px">Assurance + Validatoren</text>
  <text x="1018" y="488" class="small" font-family="Arial" fill="#486475" font-size="17px">Vollständigkeit · Plausibilität</text>
  <text x="1018" y="509" class="small" font-family="Arial" fill="#486475" font-size="17px">QA ist keine Freigabe</text>
  <rect x="380" y="608" width="240" height="110" rx="12" class="human" fill="#fff1e5" stroke="#c7692a" stroke-width="2" />
  <text x="398" y="640" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">06 Anfrage freigeben</text>
  <text x="398" y="671" class="body" font-family="Arial" fill="#14364e" font-size="18px">Reviewer + RA/Privacy</text>
  <text x="398" y="697" class="small" font-family="Arial" fill="#486475" font-size="17px">Gezielt · im Pilot simuliert</text>
  <rect x="1000" y="608" width="240" height="110" rx="12" class="human" fill="#fff1e5" stroke="#c7692a" stroke-width="2" />
  <text x="1018" y="640" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">07 Medizinisch prüfen</text>
  <text x="1018" y="671" class="body" font-family="Arial" fill="#14364e" font-size="18px">Medical Safety Reviewer</text>
  <text x="1018" y="697" class="small" font-family="Arial" fill="#486475" font-size="17px">Entscheidung + Begründung</text>
  <rect x="1320" y="608" width="240" height="110" rx="12" class="human" fill="#fff1e5" stroke="#c7692a" stroke-width="2" />
  <text x="1338" y="640" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">08 Versand freigeben</text>
  <text x="1338" y="671" class="body" font-family="Arial" fill="#14364e" font-size="18px">Regulatory Affairs</text>
  <text x="1338" y="697" class="small" font-family="Arial" fill="#486475" font-size="17px">Version · Land · Empfänger</text>
  <rect x="1320" y="808" width="240" height="110" rx="12" class="system" fill="#edf3f7" stroke="#315f7b" stroke-width="2" />
  <text x="1338" y="840" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">09 Paket / Simulator</text>
  <text x="1338" y="871" class="body" font-family="Arial" fill="#14364e" font-size="18px">Workflow / Adapter</text>
  <text x="1338" y="897" class="small" font-family="Arial" fill="#486475" font-size="17px">Hash + gültige Freigaben</text>
  <rect x="1000" y="808" width="240" height="110" rx="12" class="system" fill="#edf3f7" stroke="#315f7b" stroke-width="2" />
  <text x="1018" y="840" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">10 Quittung prüfen</text>
  <text x="1018" y="871" class="body" font-family="Arial" fill="#14364e" font-size="18px">System + RA</text>
  <text x="1018" y="897" class="small" font-family="Arial" fill="#486475" font-size="17px">Unknown zuerst abgleichen</text>
  <rect x="690" y="808" width="240" height="110" rx="12" class="human" fill="#fff1e5" stroke="#c7692a" stroke-width="2" />
  <text x="708" y="840" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">11 Untersuchung</text>
  <text x="708" y="871" class="body" font-family="Arial" fill="#14364e" font-size="18px">PMS · Technik · QM</text>
  <text x="708" y="897" class="small" font-family="Arial" fill="#486475" font-size="17px">CAPA · Wirksamkeit</text>
  <rect x="380" y="1009" width="240" height="111" rx="12" class="agent" fill="#e5f2f8" stroke="#2a7fa5" stroke-width="2" />
  <text x="398" y="1041" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">12 Trends bewerten</text>
  <text x="398" y="1072" class="body" font-family="Arial" fill="#14364e" font-size="18px">Statistik + Agent + PMS</text>
  <text x="398" y="1098" class="small" font-family="Arial" fill="#486475" font-size="17px">Nenner · Signalentscheidung</text>
  <rect x="60" y="1009" width="240" height="111" rx="12" class="agent" fill="#e5f2f8" stroke="#2a7fa5" stroke-width="2" />
  <text x="78" y="1041" class="name" font-family="Arial" fill="#14364e" font-size="20px" font-weight="700">13 PSUR erstellen</text>
  <text x="78" y="1072" class="body" font-family="Arial" fill="#14364e" font-size="18px">Agent + Human Review</text>
  <text x="78" y="1098" class="small" font-family="Arial" fill="#486475" font-size="17px">Snapshot + Freigabe</text>
  <text x="521" y="351" class="small" style="fill:#a34812" font-family="Arial" fill="#a34812" font-size="17px">Dringlich: vorläufigen Bericht direkt menschlich prüfen</text>
  <text x="716" y="543" class="small" font-family="Arial" fill="#486475" font-size="17px">Lücke: gezielt nachfordern</text>
  <text x="393" y="543" class="small" font-family="Arial" fill="#486475" font-size="17px">Neue Evidenz</text>
  <text x="1136" y="555" class="small" font-family="Arial" fill="#486475" font-size="17px">Befunde offenlegen</text>
  <text x="1251" y="649" class="small" font-family="Arial" fill="#486475" font-size="17px">melden</text>
  <text x="694" y="745" class="small" font-family="Arial" fill="#486475" font-size="17px">Beobachten / untersuchen: eigener begründeter Weg</text>
  <text x="698" y="1044" class="body" font-family="Arial" fill="#14364e" font-size="18px">Neue Sicherheitsinformationen öffnen den Review erneut.</text>
  <text x="698" y="1078" class="body" font-family="Arial" fill="#14364e" font-size="18px">CAPA, Risk File, CER, PMCF und SSCP bleiben versioniert.</text>
  <text x="698" y="1111" class="small" font-family="Arial" fill="#486475" font-size="17px">Keine automatische Fallfreigabe, keine echte Submission, keine stille Änderung alter Entscheidungen.</text>
  <rect x="40" y="1162" width="1580" height="44" rx="10" fill="#fff1e5" />
  <text x="62" y="1191" class="body" font-family="Arial" fill="#14364e" font-size="18px">Entwurf 0.1 · Fall, Assessment, Bericht, Versand und CAPA haben getrennte Zustände. Eine Quittung schließt nicht den Fall.</text>
