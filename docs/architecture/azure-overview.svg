<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1140" viewBox="0 0 1660 1140" role="img" aria-labelledby="title desc">
  <title id="title">Cohors: Azure-Architektur für den PMS-Piloten</title>
  <desc id="desc">Menschen arbeiten über die autorisierte Domänen-API. Azure SQL führt Zustand, Freigaben und Outbox. Durable Functions koordinieren Agenten, deren Tools durch einen Knowledge-Gate begrenzt sind. Foundry liefert Modelle, Blob die Evidenz und AI Search den abgeleiteten Suchindex. Ein unabhängiger Watchdog schützt Fristen. Behördenübermittlung ist ausschließlich simuliert.</desc>
